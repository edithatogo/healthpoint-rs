[package]
name = "healthpoint-rs-boundary-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]
resolver = "3"

[dependencies]
libfuzzer-sys = "=0.4.13"
healthpoint-fhir = { path = "../crates/healthpoint-fhir" }
healthpoint-core = { path = "../crates/healthpoint-core" }
serde_json = "1"

[[bin]]
name = "fhir_mapping"
path = "fuzz_targets/fhir_mapping.rs"
test = false
doc = false
bench = false

[profile.release]
opt-level = 1
codegen-units = 16
